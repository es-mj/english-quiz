<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>📚 English Quiz</h1>

  <div id="dayScreen">
    <h2>DAY 선택</h2>
    <div id="dayList"></div>
  </div>


  <div id="quizScreen" class="hidden">

    <div class="top">
      <button id="backBtn">← DAY 선택</button>
      <span id="progress"></span>
    </div>

    <div class="card">

      <div id="question"></div>

      <button id="modeBtn">
        🔄 방향 변경
      </button>

      <button id="speakBtn">
        🔊 발음 듣기
      </button>

      <input 
        id="answerInput"
        placeholder="정답 입력"
        autocomplete="off"
      >

      <button id="checkBtn">
        확인
      </button>

      <div id="result"></div>

      <div id="info"></div>

    </div>

  </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="script.js"></script>

</body>
</html>
