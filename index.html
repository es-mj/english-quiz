<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blossom English Vocabulary</title>

  <link rel="stylesheet" href="style.css" />

  <!-- CSV 읽기용 -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

  <!-- DAY 선택 화면 -->
  <div id="dayScreen" class="screen">

    <h1>🌱 Blossom English</h1>
    <p>학습할 DAY를 선택하세요</p>

    <div id="dayButtons" class="day-buttons">
      <!-- JS에서 생성 -->
    </div>

  </div>


  <!-- 퀴즈 화면 -->
  <div id="quizScreen" class="screen hidden">

    <div class="top-bar">

      <button id="backBtn">
        ← DAY 선택
      </button>

      <span id="dayTitle">
        DAY -
      </span>

    </div>


    <div class="quiz-info">

      <span id="progress">
        0 / 0
      </span>

    </div>


    <div class="card">

      <div id="wordType" class="word-type">
        <!-- 품사 -->
      </div>


      <div id="questionWord" class="word">
        WORD
      </div>


      <button id="speakBtn">
        🔊 발음 듣기
      </button>


      <div id="answerBox" class="answer hidden">

        <div id="answerText">
          뜻
        </div>

      </div>


      <button id="showAnswerBtn">
        정답 보기
      </button>


    </div>


    <div class="quiz-buttons">

      <button id="modeBtn">
        EN → KO
      </button>


      <button id="nextBtn">
        다음
      </button>

    </div>


    <button id="restartBtn">
      🔄 DAY 다시 풀기
    </button>


  </div>



<script src="script.js"></script>

</body>
</html>
